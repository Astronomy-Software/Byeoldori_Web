name: Web Tests

# PR 단계에서 단위 테스트(node --test)를 돌려 회귀를 머지 전에 잡는다.
# main push 배포(deploy.yml)도 배포 전에 같은 테스트를 실행한다.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
